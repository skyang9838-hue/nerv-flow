<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NERV 흐름도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#0a0a0b; --bg2:#0f0f11; --panel:#141416; --panel2:#1a1a1d; --panel3:#222226;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --ink:#f1ebe1; --ink2:#b7b0a5; --ink3:#7c776e; --ink4:#55514b;
  --or:#ff7a1a; --or2:#ffa04d; --or3:#ffc48f; --ordeep:#b24d06;
  --quiet:#9a948a;
  --flap:"IBM Plex Sans KR",Pretendard,"Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --tw:38px; --gap:5px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);overflow-x:hidden}
.top>div{min-width:0}
body{font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:14px;line-height:1.5;
  min-height:100vh;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 500px at 70% -10%,rgba(255,122,26,.07),transparent 60%),var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1680px;margin:0 auto;padding:18px 28px 26px}

/* 머리줄 */
header{display:flex;align-items:center;gap:18px;height:48px}
.logo{display:flex;align-items:center;gap:11px}
.mark{width:30px;height:30px;border-radius:7px;background:var(--or);display:grid;place-items:center;
  box-shadow:0 0 0 1px rgba(255,160,77,.5) inset,0 6px 18px -6px rgba(255,122,26,.7)}
.logo h1{font-family:var(--flap);font-size:21px;font-weight:700;letter-spacing:-.02em}
.logo small{color:var(--ink3);font-size:13px;margin-left:2px}
.seg{display:flex;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px;gap:2px}
.seg button{padding:5px 12px;border-radius:7px;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:7px;white-space:nowrap}
.seg button .dot{width:6px;height:6px;border-radius:50%;background:var(--ink4)}
.seg button.on{background:var(--panel3);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
.seg button.on .dot{background:var(--or);box-shadow:0 0 8px var(--or)}
.sp{flex:1}
.ib{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--ink2)}
.ib:hover{color:var(--ink);border-color:var(--line2)}
.ib svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tg{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink2);padding:0 4px}
.tg i{width:30px;height:17px;border-radius:9px;background:var(--panel3);position:relative;border:1px solid var(--line2);transition:.2s}
.tg i::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--ink3);transition:.2s}
.tg.on{color:var(--ink)} .tg.on i{background:rgba(255,122,26,.25);border-color:rgba(255,122,26,.6)}
.tg.on i::after{left:15px;background:var(--or)}

/* 윗단: 글자판 + 숫자 */
.top{display:grid;grid-template-columns:auto 1fr;gap:22px;margin-top:16px;align-items:stretch}
.housing{background:linear-gradient(#18181b,#121214);border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px;
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 24px 50px -24px rgba(0,0,0,.9);position:relative}
.housing::before{content:"";position:absolute;top:9px;right:10px;width:6px;height:6px;border-radius:50%;background:#2c2c31;box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}
.housing.live::before{background:var(--or);box-shadow:0 0 10px var(--or)}
.rowlab{display:flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.08em;color:var(--ink3);margin:0 0 6px 2px;font-family:var(--mono);text-transform:uppercase}
.rowlab b{color:var(--ink2);font-family:Pretendard,sans-serif;letter-spacing:0;font-size:12.5px;text-transform:none}
.rowlab.o::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--or)}
.rowlab.w::before{content:"";width:7px;height:7px;border-radius:2px;background:#e8e2d6}
.tiles{display:flex;gap:var(--gap);padding:5px;background:#070708;border-radius:8px;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.03),0 1px 0 rgba(255,255,255,.04)}
.tiles+.rowlab{margin-top:12px}
.t{position:relative;width:var(--tw);height:calc(var(--tw)*1.32);perspective:calc(var(--tw)*5);flex:none;background:#000;border-radius:4px;overflow:hidden;
  box-shadow:0 1px 1px rgba(0,0,0,.7)}
.h,.f{position:absolute;left:0;right:0;height:50%;overflow:hidden}
.h.up,.f.fu{top:0;border-radius:4px 4px 0 0;background:linear-gradient(#2a2a2f,#232327);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 -1px 0 rgba(0,0,0,.85)}
.h.dn,.f.fd{bottom:0;border-radius:0 0 4px 4px;background:linear-gradient(#1f1f23,#26262a);box-shadow:inset 0 3px 4px -3px rgba(0,0,0,.8)}
.dest .t:not(.blank) .h.up,.dest .t:not(.blank) .f.fu{background:linear-gradient(#ff8a2e,#ff7a1a);box-shadow:inset 0 1px 0 rgba(255,220,180,.5),inset 0 -1px 0 rgba(90,35,0,.6)}
.dest .t:not(.blank) .h.dn,.dest .t:not(.blank) .f.fd{background:linear-gradient(#f06c10,#fa7618);box-shadow:inset 0 3px 4px -3px rgba(80,30,0,.5)}
.dest .t:not(.blank){background:#7a3204}
.t.blank{background:#050506}
.t.blank .h.up,.t.blank .f.fu{background:#141417;box-shadow:inset 0 -1px 0 rgba(0,0,0,.8)}
.t.blank .h.dn,.t.blank .f.fd{background:#121215;box-shadow:inset 0 2px 3px -2px rgba(0,0,0,.7)}
.h span,.f span{position:absolute;left:0;right:0;height:calc(var(--tw)*1.32);display:flex;align-items:center;justify-content:center;
  font-family:var(--flap);font-weight:700;font-size:calc(var(--tw)*.58);letter-spacing:-.02em;color:#efe9df;line-height:1}
.dest .h span,.dest .f span{color:#1a0d02}
.t.sm span{font-size:calc(var(--tw)*.44);font-weight:500;opacity:.75}
.up span,.fu span{top:0} .dn span,.fd span{bottom:0}
.f.fu{transform-origin:50% 100%;z-index:3;backface-visibility:hidden}
.f.fd{transform-origin:50% 0;z-index:3;transform:rotateX(90deg);backface-visibility:hidden}
.f::after{content:"";position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.t::before,.t::after{content:"";position:absolute;top:calc(50% - 3px);width:2px;height:6px;background:#3a3a40;z-index:6;border-radius:1px}
.t::before{left:0}.t::after{right:0}
.t.flip .fu{animation:fu var(--fd,55ms) ease-in forwards}
.t.flip .fu::after{animation:shadeIn var(--fd,55ms) ease-in forwards}
.t.flip .fd{animation:fd var(--fd,55ms) ease-out var(--fd,55ms) forwards}
.t.flip .fd::after{animation:shadeOut var(--fd,55ms) ease-out var(--fd,55ms) both}
.t.flip.land .fd{animation-timing-function:cubic-bezier(.3,1.45,.55,1)}
@keyframes fu{to{transform:rotateX(-90deg)}}
@keyframes fd{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
@keyframes shadeIn{to{opacity:.45}}
@keyframes shadeOut{from{opacity:.45}to{opacity:0}}
.t.blank .h span,.t.blank .f span{color:transparent}

.ctrl{display:flex;align-items:center;gap:10px;margin-top:12px}
.play{height:38px;padding:0 16px 0 13px;border-radius:9px;background:var(--or);color:#1a0d02;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;
  box-shadow:0 1px 0 rgba(255,220,180,.6) inset,0 -2px 0 rgba(120,45,0,.45) inset,0 10px 24px -10px rgba(255,122,26,.8)}
.play:hover{background:var(--or2)}
.play svg{width:14px;height:14px;fill:currentColor}
.status{font-size:12.5px;color:var(--ink3);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status b{color:var(--or2);font-weight:600;font-family:var(--mono);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;max-width:calc(var(--tw)*14 + var(--gap)*13 + 10px)}
.chip{font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:var(--bg2)}
.chip:hover{border-color:var(--line2);color:var(--ink)}
.chip.on{border-color:rgba(255,122,26,.7);color:var(--or3);background:rgba(255,122,26,.08)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:auto 1fr 1fr;gap:10px;min-width:0}
.stats .cap{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;color:var(--ink3);font-size:12.5px}
.stats .cap b{color:var(--ink);font-weight:600;font-size:14px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.st .k{font-size:12.5px;color:var(--ink3)}
.st .v{font-family:var(--mono);font-weight:600;font-size:30px;letter-spacing:-.03em;line-height:1.1;margin-top:6px}
.st .v small{font-family:Pretendard,sans-serif;font-size:13px;color:var(--ink3);font-weight:500;margin-left:4px;letter-spacing:0}
.st .s{font-size:12px;color:var(--ink3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.hl .v{color:var(--or)}

/* 흐름 */
.flowbox{margin-top:18px;background:linear-gradient(var(--bg2),#0c0c0e);border:1px solid var(--line);border-radius:16px;position:relative;overflow:hidden}
.flowscroll{overflow-x:auto}
#flow{display:block;min-width:1080px;width:100%}
.flowhint{position:absolute;right:16px;bottom:10px;font-size:12px;color:var(--ink4)}
svg text{font-family:Pretendard,"Malgun Gothic",sans-serif}
.colh .n{font-family:var(--mono);font-size:11px;fill:var(--or);letter-spacing:.1em}
.colh .t{font-size:13.5px;fill:var(--ink);font-weight:600}
.colh line{stroke:var(--line2)}
.node rect.bg{fill:var(--panel2);stroke:rgba(255,255,255,.08);transition:fill .2s,stroke .2s}
.node .lab{font-size:13px;fill:var(--ink);font-weight:500}
.node .cnt{font-family:var(--mono);font-size:13px;fill:var(--ink2);font-weight:600}
.node .cnt.ko{font-family:Pretendard,sans-serif;font-weight:500;font-size:12px}
.node .pct{font-family:var(--mono);font-size:10.5px;fill:var(--ink4)}
.node .bar{fill:var(--or)}
.node.quiet .bar{fill:var(--quiet);opacity:.5}
.node.zero .lab{fill:var(--ink4)} .node.zero .cnt{fill:var(--ink4)}
.node.zero rect.bg{fill:transparent;stroke-dasharray:3 3;stroke:rgba(255,255,255,.12)}
.node{cursor:pointer}
.node:hover rect.bg{stroke:rgba(255,122,26,.55)}
.node.sel rect.bg,.node.lit rect.bg{stroke:var(--or);fill:#2a1a0e}
.node.lit rect.bg{filter:url(#glow)}
.dim .node:not(.sel):not(.on) {opacity:.42}
.rib{transition:opacity .25s}
.rib.o{fill:var(--or)}
.rib.q{fill:var(--quiet)}
.base .rib.o{opacity:.30} .base .rib.q{opacity:.11}
.dim .base .rib{opacity:.06}
.hi .rib{fill:url(#hg);opacity:.95}
.rule path{fill:none;stroke:#e8e2d6;stroke-width:1.1;stroke-dasharray:3 4;opacity:.55}
.rule path.unused{stroke:var(--or3);opacity:.9}
.rule text{font-size:10.5px;fill:var(--or3)}
.zerotag{font-size:10px;fill:var(--ink4);font-family:var(--mono)}

/* 시간 띠 */
.timebox{margin-top:16px;display:grid;grid-template-columns:150px 1fr;gap:0 14px;align-items:center}
.timebox .lg{font-size:12.5px;color:var(--ink3);display:flex;align-items:center;gap:8px}
.timebox .lg i{width:9px;height:9px;border-radius:2px;background:var(--or)}
.timebox .lg i.c{background:#5a5650}
#time{width:100%;display:block}
#time .ax{font-family:var(--mono);font-size:10.5px;fill:var(--ink4)}
#time .axk{font-size:11px;fill:var(--or2);opacity:.7}
#time rect.d{fill:var(--or)} #time rect.c{fill:#5a5650}
#time rect.d:hover,#time rect.c:hover{fill:var(--or3)}
.tip{position:fixed;pointer-events:none;background:#1f1f23;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--ink);
  box-shadow:0 10px 30px rgba(0,0,0,.6);opacity:0;transition:opacity .12s;z-index:30;white-space:nowrap}
.tip.on{opacity:1}
footer{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--ink4);display:flex;gap:18px;flex-wrap:wrap}
footer code{font-family:var(--mono);color:var(--ink3)}

/* 오른쪽 상세 */
.drawer{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:92vw;background:#121214;border-left:1px solid var(--line2);z-index:20;
  transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:22px 22px 26px;overflow-y:auto;box-shadow:-30px 0 60px rgba(0,0,0,.6)}
.drawer.on{transform:none}
.drawer .x{position:absolute;top:16px;right:16px}
.drawer .col{font-family:var(--mono);font-size:11.5px;color:var(--or);letter-spacing:.1em}
.drawer h2{font-family:var(--flap);font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.drawer .big{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.drawer .big b{font-family:var(--mono);font-size:40px;font-weight:600;color:var(--or);letter-spacing:-.03em}
.drawer .big span{color:var(--ink3);font-size:13px}
.drawer p.desc{color:var(--ink2);margin-top:10px;font-size:14px;line-height:1.65}
.drawer h3{font-size:12px;color:var(--ink3);font-weight:600;margin:20px 0 8px;letter-spacing:.02em}
.bars .r{display:grid;grid-template-columns:96px 1fr 40px;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.bars .r .l{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .r .b{height:8px;border-radius:4px;background:var(--panel3);overflow:hidden}
.bars .r .b i{display:block;height:100%;background:var(--or);border-radius:4px}
.bars .r .n{font-family:var(--mono);font-size:12px;color:var(--ink3);text-align:right}
.files{display:flex;flex-wrap:wrap;gap:6px}
.files code{font-family:var(--mono);font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--ink2)}
.note{font-size:12.5px;color:var(--ink3);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:16px;line-height:1.6}

/* ── 투어 모드 ── */
.caption{display:none;background:linear-gradient(#17171a,#121214);border:1px solid var(--line);border-radius:14px;padding:16px 20px 14px;flex-direction:column;min-width:0;
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
body.tour .caption{display:flex}
body.tour .stats,body.tour .ctrl,body.tour .chips,body.tour .timebox,body.tour footer,body.tour #ruleBtn{display:none}
.tsteps{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tsteps button{font-size:14px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink3);background:var(--bg2);white-space:nowrap}
.tsteps button.done{color:var(--ink2);border-color:rgba(255,122,26,.25)}
.tsteps button.on{color:#1a0d02;background:var(--or);border-color:var(--or);font-weight:700}
.tsteps .grp{display:flex;gap:3px;padding:2px;border-radius:999px;border:1px dashed rgba(255,255,255,.12)}
.tsteps .grp>span{font-size:13px;color:var(--ink3);padding:0 4px 0 7px;align-self:center}
.tsteps i{width:10px;height:1px;background:var(--line2)}
.ck{margin-top:14px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--or)}
.caption h2{font-family:var(--flap);font-size:25px;line-height:1.42;font-weight:700;letter-spacing:-.02em;margin-top:6px;text-wrap:balance;min-height:2.84em}
.caption h2 em{font-style:normal;color:var(--or2)}
.cx{margin-top:8px;min-height:34px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink3);font-size:14.5px}
.cx .hs{display:flex;align-items:center;gap:6px}
.cx .hs b{font-weight:600;font-size:14px;padding:4px 10px;border-radius:7px;background:var(--panel3);border:1px solid var(--line2);color:var(--ink3);transition:all .3s}
.cx .hs b.on{background:rgba(255,122,26,.16);border-color:rgba(255,122,26,.7);color:var(--or3)}
.cx .hs i{font-style:normal;color:var(--ink4)}
.cx .hs .lp{color:var(--or2);display:grid;place-items:center;opacity:0;transition:opacity .3s}
.cx .hs .lp.on{opacity:1;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tnav{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:12px}
.tnav .play{padding:0 14px 0 18px}
.tnav .play svg{width:16px;height:16px}
.tnav .play.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 1px 0 rgba(255,220,180,.6) inset,0 -2px 0 rgba(120,45,0,.45) inset,0 0 0 0 rgba(255,122,26,.55)}50%{box-shadow:0 1px 0 rgba(255,220,180,.6) inset,0 -2px 0 rgba(120,45,0,.45) inset,0 0 0 8px rgba(255,122,26,0)}}
.khint{font-size:13.5px;color:var(--ink4)}
.skip{font-size:14.5px;color:var(--ink3)} .skip:hover{color:var(--or2)}
.modeb{font-size:14.5px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink2)}
.modeb:hover{color:var(--ink);border-color:rgba(255,122,26,.5)}
body.tour .node .cnt,body.tour .node .bar,body.tour .node .pct,body.tour .node .zt{display:none}
body.tour .base{display:none}
body.tour #nodes .node{opacity:.38;transition:opacity .35s}
body.tour #nodes .node.on{opacity:1}
body.tour .node.ghost rect.bg{fill:transparent;stroke-dasharray:3 4;stroke:rgba(255,255,255,.14)}
body.tour .node.ghost .lab{fill:var(--ink4);font-size:14px}
body.tour .node.ghost.on rect.bg{stroke:rgba(255,160,77,.6);fill:transparent;filter:none}
body.tour .node{cursor:default}
.skel path{fill:none;stroke:rgba(255,255,255,.07);stroke-width:1.2}
.tp{fill:none;stroke:url(#hg);stroke-width:8;stroke-linecap:round}
.tp.ghost{stroke:rgba(255,160,77,.55);stroke-width:2.2;stroke-dasharray:2 6}
.tp.old{opacity:.32;transition:opacity .4s}
.rd{fill:none;stroke:#e8e2d6;stroke-width:1.6;stroke-dasharray:5 6;opacity:.75;animation:ants .9s linear infinite}
@keyframes ants{to{stroke-dashoffset:-22}}
.rdl{font-size:13px;fill:#e8e2d6;opacity:.8}
.loop{fill:none;stroke:var(--or2);stroke-width:2.6;stroke-dasharray:7 7;animation:ants 1s linear infinite}
.loopl{font-size:15px;fill:var(--or3);font-weight:600}
.badge circle{fill:var(--or)} .badge text{font-size:15px;font-weight:800;fill:#1a0d02}
.badge{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.tlab{font-size:14px;fill:var(--or3);font-weight:600}


/* ── 투어 v2: 글자판 없음, 큰 자막 + 흐름 + 진행줄 ── */
.housing{display:none!important}
.top{grid-template-columns:minmax(280px,auto) 1fr}
.tourtop,.tournav{display:none}
body.tour .tourtop{display:block;padding:20px 4px 4px;min-height:176px}
body.tour .tournav{display:flex;align-items:center;gap:10px;margin-top:14px}
body.tour .top,body.tour .seg{display:none}
body.tour .flowbox{margin-top:14px}
.tourtop .ck{margin:0;font-family:Pretendard,sans-serif;font-size:16px;font-weight:700;letter-spacing:0;color:var(--or)}
.tourtop h2{font-family:var(--flap);font-size:clamp(27px,2.9vw,40px);line-height:1.36;font-weight:700;letter-spacing:-.025em;margin-top:6px;max-width:980px}
.tourtop h2 em{font-style:normal;color:var(--or2)}

function aggregate() {
  const hs = D.hosts.filter(h => hostSel === 'all' || h.host === hostSel);
  const node = {}, edge = {}, paths = {}, daily = {}, skills = {};
  let turns = 0, sessions = 0, first = null, last = null;
  for (const h of hs) {
    for (const k in h.node) node[k] = (node[k] || 0) + h.node[k];
    for (const k in h.edge) edge[k] = (edge[k] || 0) + h.edge[k];
    for (const k in h.paths || {}) paths[k] = (paths[k] || 0) + h.paths[k];
    for (const k in h.daily) daily[k] = (daily[k] || 0) + h.daily[k];
    for (const k in h.skills || {}) skills[k] = (skills[k] || 0) + h.skills[k];
    turns += h.turns; sessions += h.sessions;
    if (h.first_day && (!first || h.first_day < first)) first = h.first_day;
    if (h.last_day && (!last || h.last_day > last)) last = h.last_day;
  }
  const P = Object.entries(paths).map(([k, c]) => ({ cols: k.split(' > ').map(s => s.split('+')), c }));
  return { node, edge, P, daily, skills, turns, sessions, first, last, hosts: hs };
}

/* 길 묶음 → 이웃 열 사이 연결 수 */
function edgesFrom(P) {
  const e = {};
  for (const p of P) for (let i = 0; i < p.cols.length - 1; i++)
    for (const a of p.cols[i]) for (const b of p.cols[i + 1]) { const k = i + '|' + a + '>' + b; e[k] = (e[k] || 0) + p.c; }
  return e;
}

  const padL = 26, padR = 26, top = 58, bot = isTour() ? 54 : 22;
  const tour = isTour();
  const w0 = tour ? 210 : 74, nw = tour ? 168 : 156;
  const gapX = (W - padL - padR - w0 - nw * 5) / 5;
  const cols = COLS.map((c, ci) => {
    const x = ci === 0 ? padL : padL + w0 + gapX + (ci - 1) * (nw + gapX);
    const w = ci === 0 ? w0 : nw;
    const list = tour && TOUR_NODES[ci] ? TOUR_NODES[ci] : c.nodes;
    const n = list.length, avail = H - top - bot;
    let nodes;
    if (ci === 0) {
      const h = tour ? 196 : avail * 0.62; nodes = [{ n: '말', x, y: top + (avail - h) / 2, w, h }];
    } else {
      const g = tour ? 14 : 8, h = Math.min(tour ? 54 : 50, (avail - g * (n - 1)) / n), tot = h * n + g * (n - 1), y0 = top + (avail - tot) / 2;
      nodes = list.map((nm, i) => ({ n: nm, x, y: y0 + i * (h + g), w, h }));
    }
    return { x, w, nodes, name: c.name };
  });

/* 연결(이웃 열) 리본 좌표 계산 */
function ribbons(E, maxC) {
  const R = [];
  const maxW = 34;
  const wOf = c => c <= 0 ? 0 : 1.6 + Math.sqrt(c / maxC) * maxW;
  for (const k in E) {
    const c = E[k]; if (!c) continue;
    const [ci, rest] = [+k.split('|')[0], k.slice(k.indexOf('|') + 1)];
    const [a, b] = rest.split('>');
    const A = geo.cols[ci].nodes.find(n => n.n === a), B = geo.cols[ci + 1].nodes.find(n => n.n === b);
    if (!A || !B) continue;
    R.push({ k, ci, a, b, A, B, c, w: wOf(c) });
  }
  // 칸마다 쌓기: 나가는 쪽은 도착 칸 순서, 들어오는 쪽은 출발 칸 순서
  const stack = (side) => {
    const by = {};
    for (const r of R) { const nd = side === 'out' ? r.A : r.B; (by[nd.x + ':' + nd.n] = by[nd.x + ':' + nd.n] || { nd, list: [] }).list.push(r); }
    for (const key in by) {
      const { nd, list } = by[key];
      list.sort((p, q) => side === 'out' ? p.B.y - q.B.y : p.A.y - q.A.y);
      const tot = list.reduce((s, r) => s + r.w, 0), room = nd.h * 0.86;
      const sc = tot > room ? room / tot : 1, used = tot * sc;
      let y = nd.y + (nd.h - used) / 2;
      for (const r of list) { const ww = r.w * sc; r[side] = [y, y + ww]; y += ww; }
    }
  };
  stack('out'); stack('in');
  return R;
}
function ribPath(r, f = 1) {
  const x1 = r.A.x + r.A.w, x2 = r.B.x, mx = (x1 + x2) / 2;
  const [a1, a2] = r.out, [b1, b2] = r.in;
  const A2 = a1 + (a2 - a1) * f, B2 = b1 + (b2 - b1) * f;
  return `M${x1},${a1}C${mx},${a1} ${mx},${b1} ${x2},${b1}L${x2},${B2}C${mx},${B2} ${mx},${A2} ${x1},${A2}Z`;
}
function midPath(r) {
  const x1 = r.A.x + r.A.w, x2 = r.B.x, mx = (x1 + x2) / 2;
  const a = (r.out[0] + r.out[1]) / 2, b = (r.in[0] + r.in[1]) / 2;
  return `M${x1},${a}C${mx},${a} ${mx},${b} ${x2},${b}`;
}

/* 한 칸을 지난 말 전부의 길 켜기 */
function highlightNode(key, hover) {
  const [col, n] = key.split('|');
  const ci = COLS.findIndex(c => c.name === col);
  const sub = agg.P.filter(p => p.cols[ci].includes(n));
  const E = edgesFrom(sub);
  const hi = $('hi'); hi.innerHTML = '';
  $('flow').classList.add('dim');
  const lit = new Set([key]);
  for (const k in E) {
    const r = ribByKey[k]; if (!r) continue;
    el('path', { d: ribPath(r, Math.min(1, E[k] / r.c)), class: 'rib' }, hi);
    const [c0] = k.split('|'); const [a, b] = k.slice(k.indexOf('|') + 1).split('>');
    lit.add(nk(+c0, a)); lit.add(nk(+c0 + 1, b));
  }
  document.querySelectorAll('#nodes .node').forEach(g => {
    g.classList.toggle('on', lit.has(g.dataset.k));
    g.classList.toggle('sel', g.dataset.k === key);
  });
  return { sub, E, ci, n };
}
function clearHi() {
  if (!$('hi')) return;
  $('hi').innerHTML = ''; $('flow').classList.remove('dim');
  document.querySelectorAll('#nodes .node').forEach(g => g.classList.remove('on', 'sel', 'lit'));
}

function drawRules() {
  const g = $('rule'); g.innerHTML = '';

  for (const [c0, a, c1, b] of RULE) {
    const A = geo.cols[c0].nodes.find(x => x.n === a), B = geo.cols[c1].nodes.find(x => x.n === b);
    const used = (agg.edgeAdj[c0 + '|' + a + '>' + b] || 0) > 0;
    const x1 = A.x + A.w, x2 = B.x, mx = (x1 + x2) / 2, y1 = A.y + A.h / 2, y2 = B.y + B.h / 2;
    el('path', { d: `M${x1},${y1}C${mx},${y1} ${mx},${y2} ${x2},${y2}`, class: used ? '' : 'unused' }, g);

}

  { t: '← 뒤로', back: true },
];
function choiceView(kind) {
  scene = 0; tourGen++;
  resetTourLayer(); renderSteps();
  const S = SCENES[0];
  const seen = visited.size > 0;
  $('ck').textContent = kind === 'sub' ? '③ 시키기' : (seen ? '다른 말' : '시작');
  $('ch').innerHTML = kind === 'sub'
    ? '어떤 일을 <em>시켜</em> 볼까요?<span class="sub">일하는 방식이 셋이에요. 클로드가 직접, 브라우저를 조종해서, 하네스로 여럿이 나눠서.</span>'
    : (seen ? '다른 말도 <em>걸어</em> 볼까요?<span class="sub">아직 안 본 말풍선을 골라 보세요. ✓는 이미 본 길이에요.</span>' : S.h);
  $('cx').innerHTML = ''; $('res').classList.remove('on');
  $('tprev').style.visibility = 'hidden';
  $('tnextTxt').textContent = '순서대로 보기';
  $('tnext').classList.remove('pulse');
  const list = kind === 'sub' ? CH_SUB.slice() : CH_TOP.slice();
  const allSeen = visited.has(1) && visited.has(2) && (visited.has(3) || visited.has(4) || visited.has(5));
  if (kind !== 'sub' && allSeen) list.push({ t: '한 바퀴 보기', tag: '정리', go: 6, fin: true });
  const box = $('chList'); if (!box) return;
  box.innerHTML = '';
  list.forEach((c, k) => {
    const b = document.createElement('button');
    const done = c.go && visited.has(c.go) || (c.sub && (visited.has(3) && visited.has(4) && visited.has(5)));
    b.className = 'chb' + (done ? ' done' : '') + (c.back ? ' back' : '') + (c.fin ? ' fin' : '');
    b.innerHTML = `<span>${c.t}</span>${c.tag ? `<em>${done ? '✓ ' : ''}${c.tag}</em>` : ''}`;
    b.style.animationDelay = (k * 0.08) + 's';
    b.onclick = () => { if (c.back) choiceView('top'); else if (c.sub) choiceView('sub'); else goScene(c.go); };
    box.appendChild(b);
  });
  $('bubW').classList.add('choose');
  lightNode(0, '말', false);
}
function redrawScene() { if (tourReady) goScene(scene, true); }

function setMode(m) {
  tourGen++; if (playing) stop(); closeDrawer();
  document.body.classList.toggle('tour', m === 'tour');
  $('modeBtn').textContent = m === 'tour' ? '전체 숫자 보기' : '처음부터 보기';
  history.replaceState(null, '', m === 'tour' ? location.pathname + location.search : '#explore');
  tourReady = false;
  refresh();
  if (m === 'tour') { tourReady = true; goScene(0); }
  else {
    $('housing').classList.remove('live');

  }
}
$('modeBtn').onclick = () => setMode(isTour() ? 'explore' : 'tour');
$('tnext').onclick = nextScene;
$('tprev').onclick = () => goScene(Math.max(0, scene - 1));


/* ── 시작 ──────────────────────────────── */
function refresh() {
  agg = aggregate();
  agg.edgeAdj = edgesFrom(agg.P);
  renderHosts(); renderStats(); drawFlow(); drawTime(); renderFoot();
}
makeRow($('rowIn')); makeRow($('rowOut'));
setSoundIcon(); renderChips();
setMode(location.hash === '#explore' ? 'explore' : 'tour');

$('play').onclick = () => playing ? stop() : playFrom(0, false);
$('ruleBtn').onclick = () => { ruleOn = !ruleOn; $('ruleBtn').classList.toggle('on', ruleOn); drawRules(); };
$('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
$('sound').onclick = () => { soundOn = !soundOn; setSoundIcon(); if (soundOn) actx().resume(); };
$('dx').onclick = closeDrawer;
$('flow').addEventListener('click', () => { if (selNode) closeDrawer(); });
document.addEventListener('keydown', e => {
  if (isTour()) {
    if (e.code === 'Space' || e.key === 'ArrowRight') { e.preventDefault(); nextScene(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); goScene(Math.max(0, scene - 1)); }
    return;
  }
  if (e.code === 'Space') { e.preventDefault(); playing ? stop() : playFrom(0, false); }
  if (e.key === 'Escape') { if (playing) stop(); closeDrawer(); }
  if (e.key === 'r' || e.key === 'R' || e.key === 'ㄱ') $('ruleBtn').click();
});
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { drawFlow(); if (!isTour()) drawTime(); }, 120); });
</script>
</body>
</html>
